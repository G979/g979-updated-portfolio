<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-inner container">
    <a href="#hero" class="nav-logo">g<span>979</span></a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of navLinks; track link.label) {
        <li>
          <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
        </li>
      }
      <li>
        <a href="#contact" class="nav-cta" (click)="closeMenu()">Hire Me</a>
      </li>
    </ul>

    <div class="nav-right">
      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [title]="theme() === 'violet' ? 'Switch to Ocean theme' : 'Switch to Violet theme'"
        [attr.aria-label]="theme() === 'violet' ? 'Switch to Ocean theme' : 'Switch to Violet theme'"
      >
        @if (theme() === 'violet') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <span>Ocean</span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span>Violet</span>
        }
      </button>

      <button class="hamburger" (click)="toggleMenu()" [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
        <span [class.open]="menuOpen()"></span>
        <span [class.open]="menuOpen()"></span>
        <span [class.open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</nav>
